name: State Anchor Adapter

on:
  push:
    paths:
      - 'TOOLS/state_anchor_adapter/**'
      - '.github/workflows/state-anchor-adapter.yml'
  pull_request:
    paths:
      - 'TOOLS/state_anchor_adapter/**'
      - '.github/workflows/state-anchor-adapter.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run adapter tests
        working-directory: TOOLS/state_anchor_adapter
        run: pytest -q
