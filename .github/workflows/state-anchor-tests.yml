name: State Anchor Adapter Tests

on:
  push:
    paths:
      - 'TOOLS/state_anchor_adapter/**'
      - '.github/workflows/state-anchor-tests.yml'
  pull_request:
    paths:
      - 'TOOLS/state_anchor_adapter/**'
      - '.github/workflows/state-anchor-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile TOOLS/state_anchor_adapter/state_anchor_adapter.py TOOLS/state_anchor_adapter/continuity_risk_detector.py
      - run: python -m pytest -q TOOLS/state_anchor_adapter/tests/test_continuity_risk_detector.py
