name: State Anchor Adapter Tests

on:
  push:
    paths:
      - 'TOOLS/state_anchor_adapter/**'
      - '.github/workflows/state-anchor-tests.yml'
  pull_request:
    paths:
      - 'TOOLS/state_anchor_adapter/**'
      - '.github/workflows/state-anchor-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run syntax checks
        run: python -m py_compile TOOLS/state_anchor_adapter/state_anchor_adapter.py TOOLS/state_anchor_adapter/continuity_risk_detector.py TOOLS/state_anchor_adapter/adaptive_checkpoint_gate.py
      - name: Run tests
        run: python -m pytest -q TOOLS/state_anchor_adapter/tests
